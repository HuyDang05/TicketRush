openapi: 3.0.3
info:
  title: TicketRush API
  description: |
    API backend cho hệ thống đặt vé sự kiện TicketRush.

    ## Authentication
    Hầu hết các endpoint yêu cầu JWT Bearer token trong header:
    ```
    Authorization: Bearer <token>
    ```

    ## Roles
    - **CUSTOMER**: Xem sự kiện, đặt vé, thanh toán
    - **ADMIN**: Quản lý sự kiện, xem thống kê
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Development server

tags:
  - name: Auth
    description: Đăng ký và đăng nhập
  - name: Events
    description: Danh sách và chi tiết sự kiện (public)
  - name: Events Admin
    description: Quản lý sự kiện (Admin only)
  - name: Bookings
    description: Đặt vé, thanh toán, vé của tôi (Customer only)
  - name: Admin
    description: Thống kê và analytics (Admin only)

# ─────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────
paths:

  # ── AUTH ──────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản mới
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: user@example.com
              password: password123
              fullName: Nguyen Van A
              dob: "2000-01-15"
              gender: MALE
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Email đã được sử dụng

  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: password123
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Sai thông tin đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Email hoặc mật khẩu không đúng

  # ── EVENTS (PUBLIC) ───────────────────────
  /events:
    get:
      tags: [Events]
      summary: Danh sách sự kiện đã công bố
      operationId: listEvents
      parameters:
        - name: search
          in: query
          description: Tìm theo tên sự kiện (case-insensitive)
          schema:
            type: string
          example: Concert
      responses:
        '200':
          description: Danh sách sự kiện
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSummary'

  /events/{id}:
    get:
      tags: [Events]
      summary: Chi tiết sự kiện kèm sơ đồ ghế
      operationId: getEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Chi tiết sự kiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── EVENTS (ADMIN) ────────────────────────
  /events/{id}/publish:
    patch:
      tags: [Events Admin]
      summary: Publish sự kiện (DRAFT → PUBLISHED)
      operationId: publishEvent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Sự kiện đã được publish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBase'
        '400':
          description: Ngày diễn đã qua hoặc event không ở trạng thái DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{id}/end:
    patch:
      tags: [Events Admin]
      summary: Kết thúc sự kiện (PUBLISHED → ENDED)
      operationId: endEvent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Sự kiện đã kết thúc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBase'
        '400':
          description: Event không ở trạng thái PUBLISHED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/events:
    post:
      tags: [Events Admin]
      summary: Tạo sự kiện kèm zones và seats (Admin only)
      operationId: createEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
            example:
              title: Concert Đông Nhi 2025
              description: Concert lớn nhất năm
              venue: Nhà thi đấu Phú Thọ, TP HCM
              date: "2025-12-25T19:00:00Z"
              imageUrl: https://example.com/image.jpg
              zones:
                - name: VIP
                  rows: 3
                  cols: 10
                  price: 2500000
                - name: Khu A
                  rows: 4
                  cols: 12
                  price: 1500000
      responses:
        '201':
          description: Sự kiện được tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/events/{id}:
    put:
      tags: [Events Admin]
      summary: Cập nhật sự kiện (chỉ khi DRAFT và chưa có ghế bị LOCKED/SOLD)
      operationId: updateEvent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBase'
        '400':
          description: Event không ở trạng thái DRAFT hoặc đã có ghế bị giữ/bán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── BOOKINGS ──────────────────────────────
  /bookings/lock:
    post:
      tags: [Bookings]
      summary: Lock ghế — giữ chỗ trong 10 phút
      operationId: lockSeat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockSeatRequest'
            example:
              seatId: "uuid-seat-001"
      responses:
        '201':
          description: Ghế đã được giữ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockSeatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Ghế không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Ghế không tồn tại
        '409':
          description: Ghế không còn AVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Ghế vừa được người khác chọn

  /bookings/checkout:
    post:
      tags: [Bookings]
      summary: Thanh toán giả lập — xác nhận và phát hành QR Code
      operationId: checkout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
            example:
              bookingIds:
                - "uuid-booking-001"
                - "uuid-booking-002"
      responses:
        '200':
          description: Thanh toán thành công, trả về danh sách vé kèm QR
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketResponse'
        '400':
          description: Có booking không hợp lệ hoặc đã hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Booking không thuộc về user này
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /bookings/my-tickets:
    get:
      tags: [Bookings]
      summary: Vé đã mua của tôi (status = PAID)
      operationId: myTickets
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách vé đã mua, mới nhất trước
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── ADMIN DASHBOARD ───────────────────────
  /admin/dashboard/{eventId}:
    get:
      tags: [Admin]
      summary: Thống kê real-time cho một sự kiện
      operationId: eventDashboard
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thống kê sự kiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/analytics/audience:
    get:
      tags: [Admin]
      summary: Thống kê nhân khẩu học khán giả đã mua vé
      operationId: audienceAnalytics
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: query
          description: Lọc theo sự kiện. Để trống = tổng tất cả sự kiện.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thống kê nhân khẩu học
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudienceAnalyticsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

# ─────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    EventId:
      name: id
      in: path
      required: true
      description: UUID của sự kiện
      schema:
        type: string
        format: uuid

  # ── RESPONSES ─────────────────────────────
  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: Thiếu token hoặc token không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthorized
    Forbidden:
      description: Không có quyền truy cập
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Không có quyền truy cập
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Không tìm thấy

  # ── SCHEMAS ───────────────────────────────
  schemas:

    # ── Enums ──
    Role:
      type: string
      enum: [CUSTOMER, ADMIN]

    Gender:
      type: string
      enum: [MALE, FEMALE, OTHER]

    EventStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ENDED]

    SeatStatus:
      type: string
      enum: [AVAILABLE, LOCKED, SOLD]

    BookingStatus:
      type: string
      enum: [PENDING, PAID, CANCELLED]

    # ── Error ──
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
          example: Dữ liệu không hợp lệ
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    # ── Auth ──
    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
          minLength: 1
        dob:
          type: string
          format: date
          description: Ngày sinh, định dạng YYYY-MM-DD
        gender:
          $ref: '#/components/schemas/Gender'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    UserPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        dob:
          type: string
          format: date
          nullable: true
        gender:
          $ref: '#/components/schemas/Gender'
          nullable: true
        createdAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token
        user:
          $ref: '#/components/schemas/UserPublic'

    # ── Events ──
    EventBase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        venue:
          type: string
        date:
          type: string
          format: date-time
        imageUrl:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/EventStatus'
        createdAt:
          type: string
          format: date-time

    EventSummary:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          properties:
            minPrice:
              type: number
              description: Giá vé thấp nhất trong tất cả zones

    SeatItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          description: Nhãn ghế, ví dụ A1, B3
        row:
          type: integer
        col:
          type: integer
        status:
          $ref: '#/components/schemas/SeatStatus'

    ZoneWithSeats:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        rows:
          type: integer
        cols:
          type: integer
        price:
          type: number
        seats:
          type: array
          items:
            $ref: '#/components/schemas/SeatItem'

    EventDetail:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          properties:
            zones:
              type: array
              items:
                $ref: '#/components/schemas/ZoneWithSeats'

    ZoneInput:
      type: object
      required: [name, rows, cols, price]
      properties:
        name:
          type: string
          example: VIP
        rows:
          type: integer
          minimum: 1
        cols:
          type: integer
          minimum: 1
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 2500000

    CreateEventRequest:
      type: object
      required: [title, venue, date, zones]
      properties:
        title:
          type: string
        description:
          type: string
        venue:
          type: string
        date:
          type: string
          format: date-time
          description: Phải là ngày trong tương lai
        imageUrl:
          type: string
        zones:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ZoneInput'

    UpdateEventRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        venue:
          type: string
        date:
          type: string
          format: date-time
        imageUrl:
          type: string

    # ── Bookings ──
    LockSeatRequest:
      type: object
      required: [seatId]
      properties:
        seatId:
          type: string
          format: uuid

    LockSeatResponse:
      type: object
      properties:
        bookingId:
          type: string
          format: uuid
        seatId:
          type: string
          format: uuid
        seatLabel:
          type: string
          example: A3
        zoneName:
          type: string
          example: VIP
        totalPrice:
          type: number
          example: 2500000
        status:
          $ref: '#/components/schemas/BookingStatus'
        expiresAt:
          type: string
          format: date-time
          description: Thời điểm hết hạn giữ chỗ (now + 10 phút)
        createdAt:
          type: string
          format: date-time

    CheckoutRequest:
      type: object
      required: [bookingIds]
      properties:
        bookingIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    CheckoutError:
      type: object
      properties:
        message:
          type: string
          example: Một số booking đã hết hạn
        expiredBookingIds:
          type: array
          items:
            type: string
            format: uuid

    TicketResponse:
      type: object
      properties:
        bookingId:
          type: string
          format: uuid
        qrCode:
          type: string
          description: Ảnh QR Code dạng base64 PNG (data:image/png;base64,...)
        paidAt:
          type: string
          format: date-time
        seat:
          type: object
          properties:
            label:
              type: string
              example: A3
            zone:
              type: string
              example: VIP
            price:
              type: number
              example: 2500000
        event:
          type: object
          properties:
            title:
              type: string
            venue:
              type: string
            date:
              type: string
              format: date-time

    MyTicket:
      type: object
      properties:
        bookingId:
          type: string
          format: uuid
        qrCode:
          type: string
          description: Ảnh QR Code dạng base64 PNG
        paidAt:
          type: string
          format: date-time
        seatLabel:
          type: string
          example: B5
        zoneName:
          type: string
          example: Khu A
        price:
          type: number
          example: 1500000
        eventTitle:
          type: string
          example: Concert Đông Nhi 2025
        eventVenue:
          type: string
          example: Nhà thi đấu Phú Thọ, TP HCM
        eventDate:
          type: string
          format: date-time

    # ── Dashboard ──
    ZoneStat:
      type: object
      properties:
        zoneId:
          type: string
          format: uuid
        zoneName:
          type: string
        totalSeats:
          type: integer
        sold:
          type: integer
        locked:
          type: integer
        available:
          type: integer
        revenue:
          type: number
          description: Doanh thu zone (chỉ tính booking PAID)

    DashboardResponse:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        eventTitle:
          type: string
        totalSeats:
          type: integer
        sold:
          type: integer
        locked:
          type: integer
        available:
          type: integer
        totalRevenue:
          type: number
          description: Tổng doanh thu (chỉ tính booking PAID)
        fillRate:
          type: number
          description: Tỷ lệ lấp đầy theo phần trăm (sold / totalSeats * 100)
          example: 75.5
        zones:
          type: array
          items:
            $ref: '#/components/schemas/ZoneStat'

    # ── Analytics ──
    GenderDistribution:
      type: object
      properties:
        MALE:
          type: integer
        FEMALE:
          type: integer
        OTHER:
          type: integer

    AgeDistribution:
      type: object
      properties:
        under18:
          type: integer
          description: Dưới 18 tuổi
        age18to25:
          type: integer
          description: 18–25 tuổi
        age26to35:
          type: integer
          description: 26–35 tuổi
        age36to45:
          type: integer
          description: 36–45 tuổi
        above45:
          type: integer
          description: Trên 45 tuổi

    AudienceAnalyticsResponse:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
          nullable: true
          description: null nếu là tổng tất cả sự kiện
        totalBuyers:
          type: integer
          description: Tổng số user có ít nhất 1 booking PAID
        gender:
          $ref: '#/components/schemas/GenderDistribution'
        age:
          $ref: '#/components/schemas/AgeDistribution'
